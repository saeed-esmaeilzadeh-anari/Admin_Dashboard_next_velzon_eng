name: Backend CI
# Revalidate the synchronized CMS branch and database migration chain.
concurrency:
  group: cms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velzon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d velzon_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velzon_ci?schema=public
      JWT_SECRET: ci-only-secret-that-is-long-enough-to-pass-the-minimum-length
      ADMIN_NAME: CI Administrator
      ADMIN_EMAIL: ci-admin@example.test
      ADMIN_PASSWORD: ci-only-admin-password-strong-enough
      PUBLIC_SITE_URL: https://example.test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply all checked-in migrations to PostgreSQL
        run: npx prisma migrate deploy
      - name: Verify migration status
        run: npx prisma migrate status
      - name: Seed locales, content types, permissions and test administrator
        run: npm run prisma:seed
      - name: Smoke-test migrated database and seed invariants
        run: npm run test:db-smoke
      - name: Type-check
        run: npm run type-check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: API runtime and authentication smoke test
        env:
          PORT: 3101
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/velzon-backend.log 2>&1 &
          server_pid=$!
          cleanup() {
            pkill -P "$server_pid" 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3101/api/v1/health -o /tmp/velzon-health.json; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/velzon-backend.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/velzon-backend.log
            echo "Backend API did not become healthy"
            exit 1
          fi

          request_body="$(jq -n --arg email "$ADMIN_EMAIL" --arg password "$ADMIN_PASSWORD" '{email: $email, password: $password}')"
          status="$(curl --silent --show-error -o /tmp/velzon-login.json -w '%{http_code}' \
            -X POST http://127.0.0.1:3101/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            --data "$request_body")"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat /tmp/velzon-login.json
            cat /tmp/velzon-backend.log
            echo "Login endpoint returned HTTP $status"
            exit 1
          fi

          access_token="$(jq -er '.accessToken' /tmp/velzon-login.json)"
          curl --fail --silent --show-error \
            http://127.0.0.1:3101/api/v1/auth/me \
            -H "Authorization: Bearer $access_token" \
            | jq -e --arg email "$ADMIN_EMAIL" '.email == $email' >/dev/null

          echo "Backend health, POST /api/v1/auth/login and authenticated GET /api/v1/auth/me passed."
