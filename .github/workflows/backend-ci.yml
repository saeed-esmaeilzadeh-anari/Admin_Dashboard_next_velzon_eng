name: Backend CI
concurrency:
  group: cms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velzon_ci?schema=public
        run: npx prisma validate
      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velzon_ci?schema=public
        run: npx prisma generate
      - name: Type-check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velzon_ci?schema=public
          JWT_SECRET: ci-only-secret-that-is-long-enough-to-pass-the-minimum-length
        run: npm run type-check
      - name: Unit tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velzon_ci?schema=public
          JWT_SECRET: ci-only-secret-that-is-long-enough-to-pass-the-minimum-length
        run: npm test
      - name: Build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velzon_ci?schema=public
          JWT_SECRET: ci-only-secret-that-is-long-enough-to-pass-the-minimum-length
        run: npm run build
