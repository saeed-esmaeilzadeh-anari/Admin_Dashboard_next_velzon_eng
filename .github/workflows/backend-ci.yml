name: Backend CI
# Revalidate the CMS API, PostgreSQL migration chain and runtime security controls.
concurrency:
  group: cms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: velzon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d velzon_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/velzon_ci?schema=public
      JWT_SECRET: ci-only-secret-that-is-long-enough-to-pass-the-minimum-length
      ADMIN_NAME: CI Administrator
      ADMIN_EMAIL: ci-admin@example.test
      ADMIN_PASSWORD: ci-only-admin-password-strong-enough
      PUBLIC_SITE_URL: https://example.test
      PUBLIC_REGISTRATION_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply all checked-in migrations to PostgreSQL
        run: npx prisma migrate deploy
      - name: Verify migration status
        run: npx prisma migrate status
      - name: Seed locales, content types, permissions and test administrator
        run: npm run prisma:seed
      - name: Smoke-test migrated database and seed invariants
        run: npm run test:db-smoke
      - name: Type-check
        run: npm run type-check
      - name: Unit tests
        run: npm test
      - name: Build and assert Nest entrypoint
        run: |
          npm run build
          test -f dist/main.js
          echo "NestJS entrypoint generated: backend/dist/main.js"
      - name: API runtime, health, authentication and throttling smoke tests
        env:
          PORT: 3101
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/velzon-backend.log 2>&1 &
          server_pid=$!
          cleanup() {
            pkill -P "$server_pid" 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3101/api/v1/health/ready -o /tmp/velzon-health.json; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/velzon-backend.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/velzon-backend.log
            echo "Backend API did not become ready"
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3101/api/v1/health/live             | jq -e '.status == "ok"' >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3101/api/v1/health             | jq -e '.status == "ok" and .database == "connected"' >/dev/null

          request_body="$(jq -n --arg email "$ADMIN_EMAIL" --arg password "$ADMIN_PASSWORD" '{email: $email, password: $password}')"
          status="$(curl --silent --show-error -o /tmp/velzon-login.json -w '%{http_code}' \
            -X POST http://127.0.0.1:3101/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            --data "$request_body")"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat /tmp/velzon-login.json
            cat /tmp/velzon-backend.log
            echo "Login endpoint returned HTTP $status"
            exit 1
          fi

          access_token="$(jq -er '.accessToken' /tmp/velzon-login.json)"
          curl --fail --silent --show-error \
            http://127.0.0.1:3101/api/v1/auth/me \
            -H "Authorization: Bearer $access_token" \
            | jq -e --arg email "$ADMIN_EMAIL" '.email == $email and (has("sessionId") | not)' >/dev/null

          logout_status="$(curl --silent --show-error -o /tmp/velzon-logout.json -w '%{http_code}' \
            -X POST http://127.0.0.1:3101/api/v1/auth/logout \
            -H "Authorization: Bearer $access_token")"
          if [ "$logout_status" != "201" ]; then
            cat /tmp/velzon-logout.json
            echo "Expected HTTP 201 from authenticated session revocation, received $logout_status"
            exit 1
          fi
          revoked_status="$(curl --silent --show-error -o /tmp/velzon-revoked-me.json -w '%{http_code}' \
            http://127.0.0.1:3101/api/v1/auth/me \
            -H "Authorization: Bearer $access_token")"
          if [ "$revoked_status" != "401" ]; then
            cat /tmp/velzon-revoked-me.json
            echo "A revoked JWT session must no longer authenticate (received HTTP $revoked_status)"
            exit 1
          fi

          # The initial successful login counts as request 1. Four invalid
          # attempts are still processed; the sixth request must be throttled.
          bad_login_body='{"email":"missing-user@example.test","password":"wrong-password"}'
          for attempt in 1 2 3 4; do
            bad_status="$(curl --silent --show-error -o /tmp/velzon-bad-login.json -w '%{http_code}' \
              -X POST http://127.0.0.1:3101/api/v1/auth/login \
              -H 'Content-Type: application/json' --data "$bad_login_body")"
            if [ "$bad_status" != "401" ]; then
              cat /tmp/velzon-bad-login.json
              echo "Expected HTTP 401 for invalid login attempt $attempt, received $bad_status"
              exit 1
            fi
          done
          throttled_login_status="$(curl --silent --show-error -o /tmp/velzon-throttled-login.json -w '%{http_code}' \
            -X POST http://127.0.0.1:3101/api/v1/auth/login \
            -H 'Content-Type: application/json' --data "$bad_login_body")"
          if [ "$throttled_login_status" != "429" ]; then
            cat /tmp/velzon-throttled-login.json
            echo "Expected HTTP 429 after the login rate limit, received $throttled_login_status"
            exit 1
          fi

          # Public registration is explicitly enabled for this isolated CI
          # environment; three registrations are allowed and the fourth is throttled.
          for attempt in 1 2 3; do
            register_body="$(jq -n --arg email "ci-register-$attempt@example.test" \
              '{name: "CI Rate Limit User", email: $email, password: "ci-registration-password-123"}')"
            register_status="$(curl --silent --show-error -o /tmp/velzon-register.json -w '%{http_code}' \
              -X POST http://127.0.0.1:3101/api/v1/auth/register \
              -H 'Content-Type: application/json' --data "$register_body")"
            if [ "$register_status" != "201" ]; then
              cat /tmp/velzon-register.json
              echo "Expected HTTP 201 for registration attempt $attempt, received $register_status"
              exit 1
            fi
            jq -e --arg email "ci-register-$attempt@example.test" '.user.email == $email and (has("accessToken") | not)' /tmp/velzon-register.json >/dev/null
          done
          final_register_body='{"name":"CI Rate Limit User","email":"ci-register-over-limit@example.test","password":"ci-registration-password-123"}'
          throttled_register_status="$(curl --silent --show-error -o /tmp/velzon-throttled-register.json -w '%{http_code}' \
            -X POST http://127.0.0.1:3101/api/v1/auth/register \
            -H 'Content-Type: application/json' --data "$final_register_body")"
          if [ "$throttled_register_status" != "429" ]; then
            cat /tmp/velzon-throttled-register.json
            echo "Expected HTTP 429 after the registration rate limit, received $throttled_register_status"
            exit 1
          fi

          echo "Liveness/readiness, JWT login, persisted session revocation, safe /me profile, registration contract, and auth throttling passed."
      - name: Development watch-mode runtime smoke test
        env:
          PORT: 3102
        shell: bash
        run: |
          set -euo pipefail
          npm run start:dev > /tmp/velzon-backend-watch.log 2>&1 &
          server_pid=$!
          cleanup() {
            pkill -P "$server_pid" 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3102/api/v1/health/ready -o /tmp/velzon-watch-health.json; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/velzon-backend-watch.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/velzon-backend-watch.log
            echo "NestJS start:dev did not become ready"
            exit 1
          fi

          echo "NestJS start:dev watch-mode runtime smoke test passed."
