# Blocking Prettier, ESLint and repository-wide lint for maintained CMS UI.
name: CMS Frontend Quality

on:
  push:
    branches: [chore/cms-post-merge-validation]
    paths:
      - "src/app/(with-layout)/apps-cms/**"
      - ".github/workflows/frontend-lint.yml"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "tsconfig.json"
  pull_request:
    branches: [main]
    paths:
      - "src/app/(with-layout)/apps-cms/**"
      - ".github/workflows/frontend-lint.yml"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "tsconfig.json"

concurrency:
  group: cms-ui-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Verify formatting of maintained CMS pages
        shell: bash
        run: |
          set -euo pipefail
          find "src/app/(with-layout)/apps-cms" -type f -name '*.tsx' -print0 |
            xargs -0 -r npx prettier --check
      - name: Lint maintained CMS pages
        shell: bash
        run: |
          set -euo pipefail
          find "src/app/(with-layout)/apps-cms" -type f -name '*.tsx' -print0 |
            xargs -0 -r npx eslint
      - name: Run full frontend lint
        run: npm run lint
