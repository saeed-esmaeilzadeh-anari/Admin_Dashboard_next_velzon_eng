# Blocking source formatting, ESLint and full frontend lint for this release candidate.
name: CMS Frontend Quality

on:
  push:
    branches: [chore/cms-post-merge-validation]
    paths:
      - "src/**"
      - ".github/workflows/frontend-lint.yml"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "tsconfig.json"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/frontend-lint.yml"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "tsconfig.json"

concurrency:
  group: cms-ui-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Verify formatting of maintained CMS and lint-debt files
        shell: bash
        run: |
          set -euo pipefail
          find "src/app/(with-layout)/apps-cms" -type f -name '*.tsx' -print0 |
            xargs -0 -r npx prettier --check
          npx prettier --check \
            "src/app/(with-layout)/charts/apex-bar/BarCharts.tsx" \
            "src/app/(with-layout)/charts/apex-range-area/RangeChart.tsx" \
            "src/app/(with-layout)/charts/apex-timeline/TimelineCharts.tsx" \
            "src/app/(with-layout)/charts/apex-treemap/TreemapCharts.tsx" \
            "src/app/(with-layout)/ui/utilities/page.tsx" \
            "src/app/(with-nonlayout)/auth/login/page.tsx" \
            "src/app/(with-nonlayout)/auth/register/page.tsx" \
            "src/app/(with-nonlayout)/content/[typeKey]/[localeCode]/[slug]/page.tsx" \
            "src/app/(with-nonlayout)/content/[typeKey]/[localeCode]/page.tsx" \
            "src/app/backend-api/[...path]/route.ts" \
            "src/app/robots.ts" \
            "src/app/sitemap.ts" \
            "src/components/ClientProviders.tsx" \
            "src/components/Cms/PageBuilderField.tsx" \
            "src/components/Cms/PagePreview.tsx" \
            "src/components/Cms/PublicCmsHeader.tsx" \\
            "src/components/Cms/RelationField.tsx" \\
            "src/components/Cms/RepeaterField.tsx" \\
            "src/components/Common/ProfileDropdown.tsx" \\
            "src/helpers/backendApi.ts" \\
            "src/helpers/cmsApi.ts"
      - name: Lint maintained CMS and lint-debt files
        shell: bash
        run: |
          set -euo pipefail
          find "src/app/(with-layout)/apps-cms" -type f -name '*.tsx' -print0 |
            xargs -0 -r npx eslint
          npx eslint \
            "src/app/(with-layout)/charts/apex-bar/BarCharts.tsx" \
            "src/app/(with-layout)/charts/apex-range-area/RangeChart.tsx" \
            "src/app/(with-layout)/charts/apex-timeline/TimelineCharts.tsx" \
            "src/app/(with-layout)/charts/apex-treemap/TreemapCharts.tsx" \
            "src/app/(with-layout)/ui/utilities/page.tsx" \
            "src/app/(with-nonlayout)/auth/login/page.tsx" \
            "src/app/(with-nonlayout)/auth/register/page.tsx" \
            "src/app/(with-nonlayout)/content/[typeKey]/[localeCode]/[slug]/page.tsx" \
            "src/app/(with-nonlayout)/content/[typeKey]/[localeCode]/page.tsx" \
            "src/app/backend-api/[...path]/route.ts" \
            "src/app/robots.ts" \
            "src/app/sitemap.ts" \
            "src/components/ClientProviders.tsx" \
            "src/components/Cms/PageBuilderField.tsx" \
            "src/components/Cms/PagePreview.tsx" \
            "src/components/Cms/PublicCmsHeader.tsx" \\
            "src/components/Cms/RelationField.tsx" \\
            "src/components/Cms/RepeaterField.tsx" \\
            "src/components/Common/ProfileDropdown.tsx" \\
            "src/helpers/backendApi.ts" \\
            "src/helpers/cmsApi.ts"
      - name: Run full frontend lint
        run: npm run lint
