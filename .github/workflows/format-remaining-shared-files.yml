name: Format Remaining Shared Frontend Files

on:
  push:
    branches: [chore/cms-post-merge-validation]
    paths:
      - ".github/workflows/format-remaining-shared-files.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Format files reported by full lint
        run: >-
          npx prettier --write
          "src/layouts/Layouts/LayoutMenuData.tsx"
          "src/slices/auth/authSlice.ts"
          "src/slices/auth/login/thunk.ts"
          "src/slices/auth/register/thunk.ts"
          "src/slices/settings/settingsSlice.ts"
          "src/slices/users/usersSlice.ts"
      - name: Commit formatting with fast-forward safety
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            "src/layouts/Layouts/LayoutMenuData.tsx" \
            "src/slices/auth/authSlice.ts" \
            "src/slices/auth/login/thunk.ts" \
            "src/slices/auth/register/thunk.ts" \
            "src/slices/settings/settingsSlice.ts" \
            "src/slices/users/usersSlice.ts"
          if git diff --cached --quiet; then
            echo "The selected files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(frontend): format remaining shared state files"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
