name: Format Legacy CMS Pages

on:
  push:
    branches: [feat/enterprise-cms-production-v2]
    paths:
      - ".github/workflows/format-cms-pages.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Format the two outstanding CMS pages
        run: >-
          npx prettier --write
          "src/app/(with-layout)/apps-cms/audit-logs/page.tsx"
          "src/app/(with-layout)/apps-cms/content/[id]/page.tsx"
      - name: Upload formatted sources for review
        uses: actions/upload-artifact@v4
        with:
          name: formatted-cms-pages
          path: |
            src/app/(with-layout)/apps-cms/audit-logs/page.tsx
            src/app/(with-layout)/apps-cms/content/[id]/page.tsx
          if-no-files-found: error
          retention-days: 1
