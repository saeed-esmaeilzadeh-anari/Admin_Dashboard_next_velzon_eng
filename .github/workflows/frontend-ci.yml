name: Frontend CMS CI
# Revalidate the synchronized CMS branch, type-check and production build.
concurrency:
  group: cms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Keeps the CMS branch type-check and production build reproducible.
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/frontend-ci.yml"
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Type-check
        env:
          NEXT_PUBLIC_DEFAULT_AUTH: fake
          NEXT_PUBLIC_BACKEND_API_URL: http://127.0.0.1:3001/api/v1
        run: npm run type-check
      - name: Production build
        env:
          NEXT_PUBLIC_DEFAULT_AUTH: fake
          NEXT_PUBLIC_BACKEND_API_URL: http://127.0.0.1:3001/api/v1
        run: npm run build
      - name: Production server smoke test
        env:
          NEXT_PUBLIC_DEFAULT_AUTH: fake
          NEXT_PUBLIC_BACKEND_API_URL: http://127.0.0.1:3001/api/v1
          PORT: 3100
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/next-start.log 2>&1 &
          server_pid=$!
          cleanup() {
            pkill -P "$server_pid" 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3100/apps-todo -o /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/next-start.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/next-start.log
            echo "Production server did not successfully render /apps-todo"
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3100/charts/apex-bar -o /dev/null
          echo "Production start smoke test passed for /apps-todo and /charts/apex-bar"
