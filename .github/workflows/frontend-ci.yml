name: Frontend CMS CI
# Revalidate the synchronized CMS branch, type-check and production build.
concurrency:
  group: cms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Keeps the CMS branch type-check and production build reproducible.
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "middleware.ts"
      - "tsconfig.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "middleware.ts"
      - "tsconfig.json"
      - ".github/workflows/frontend-ci.yml"
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Type-check
        env:
          NEXT_PUBLIC_DEFAULT_AUTH: backend
          NEXT_PUBLIC_BACKEND_API_URL: http://127.0.0.1:3001/api/v1
        run: npm run type-check
      - name: Production build
        env:
          NEXT_PUBLIC_DEFAULT_AUTH: backend
          NEXT_PUBLIC_BACKEND_API_URL: http://127.0.0.1:3001/api/v1
        run: npm run build
      - name: Production server and backend proxy smoke test
        env:
          NEXT_PUBLIC_DEFAULT_AUTH: backend
          NEXT_PUBLIC_BACKEND_API_URL: http://127.0.0.1:3001/api/v1
          BACKEND_API_URL: http://127.0.0.1:3001/api/v1
          PORT: 3100
        shell: bash
        run: |
          set -euo pipefail

          # A tiny local upstream verifies that Next.js forwards method, path and body.
          node -e 'const http = require("node:http"); http.createServer((req, res) => { if (req.url === "/api/v1/health" && req.method === "GET") { res.writeHead(200, {"content-type":"application/json"}); res.end(JSON.stringify({status:"ok"})); return; } if (req.url === "/api/v1/auth/login" && req.method === "POST") { let body = ""; req.on("data", chunk => body += chunk); req.on("end", () => { const credentials = JSON.parse(body); if (credentials.email === "ci-admin@example.test" && credentials.password === "valid-password") { res.writeHead(200, {"content-type":"application/json"}); res.end(JSON.stringify({accessToken:"ci-bff-test-access-token-123456789", tokenType:"Bearer", expiresIn:900, user:{id:"ci-user-1",email:credentials.email,name:"CI Admin",role:"ADMIN"}})); } else { res.writeHead(401, {"content-type":"application/json"}); res.end(JSON.stringify({message:"Invalid email or password."})); } }); return; } if (req.url === "/api/v1/auth/me" && req.method === "GET") { if (req.headers.authorization === "Bearer ci-bff-test-access-token-123456789") { res.writeHead(200, {"content-type":"application/json"}); res.end(JSON.stringify({id:"ci-user-1",email:"ci-admin@example.test",name:"CI Admin",role:"ADMIN"})); } else { res.writeHead(401, {"content-type":"application/json"}); res.end(JSON.stringify({message:"Unauthorized"})); } return; } res.writeHead(404, {"content-type":"application/json"}); res.end(JSON.stringify({message:"Not found"})); }).listen(3001, "127.0.0.1");' > /tmp/mock-api.log 2>&1 &
          api_pid=$!

          api_ready=0
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:3001/api/v1/health -o /dev/null; then
              api_ready=1
              break
            fi
            sleep 1
          done
          if [ "$api_ready" -ne 1 ]; then
            cat /tmp/mock-api.log
            echo "Mock backend did not start"
            exit 1
          fi

          npm run start > /tmp/next-start.log 2>&1 &
          server_pid=$!
          cleanup() {
            pkill -P "$server_pid" 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true
            kill "$api_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3100/auth/login -o /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/next-start.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/next-start.log
            echo "Production server did not successfully render /auth/login"
            exit 1
          fi

          # CMS is the only administration area in the commercial release.
          legacy_status="$(curl --silent --show-error --output /tmp/legacy-route.html --dump-header /tmp/legacy-route-headers.txt --write-out '%{http_code}' http://127.0.0.1:3100/apps-todo)"
          if [ "$legacy_status" != "307" ]; then
            cat /tmp/legacy-route-headers.txt
            echo "Legacy demo route was not redirected to the CMS (HTTP $legacy_status)"
            exit 1
          fi
          grep -Eiq '^location: http://127\.0\.0\.1:3100/apps-cms' /tmp/legacy-route-headers.txt

          dashboard_status="$(curl --silent --show-error --output /tmp/dashboard-route.html --dump-header /tmp/dashboard-route-headers.txt --write-out '%{http_code}' http://127.0.0.1:3100/dashboard)"
          if [ "$dashboard_status" != "307" ]; then
            cat /tmp/dashboard-route-headers.txt
            echo "Template dashboard was not redirected to CMS (HTTP $dashboard_status)"
            exit 1
          fi
          grep -Eiq '^location: http://127\.0\.0\.1:3100/apps-cms' /tmp/dashboard-route-headers.txt

          # Cover additional static/template route families retained in source control.
          for legacy_path in /advance-ui/animation /apps-calendar-month-grid /dashboard-ecommerce /authinner/signin/basic /landing /nft-landing /job-landing /pricing; do
            legacy_code="$(curl --silent --show-error --output /tmp/legacy-route.html --dump-header /tmp/legacy-route-headers.txt --write-out '%{http_code}' "http://127.0.0.1:3100$legacy_path")"
            if [ "$legacy_code" != "307" ]; then
              cat /tmp/legacy-route-headers.txt
              echo "Legacy route $legacy_path was not redirected (HTTP $legacy_code)"
              exit 1
            fi
            grep -Eiq '^location: http://127\.0\.0\.1:3100/apps-cms' /tmp/legacy-route-headers.txt
          done

          unauth_cms_status="$(curl --silent --show-error --output /tmp/unauth-cms.html --dump-header /tmp/unauth-cms-headers.txt --write-out '%{http_code}' http://127.0.0.1:3100/apps-cms)"
          if [ "$unauth_cms_status" != "307" ]; then
            cat /tmp/unauth-cms-headers.txt
            echo "CMS admin route was not protected (HTTP $unauth_cms_status)"
            exit 1
          fi
          grep -Eiq '^location: http://127\.0\.0\.1:3100/auth/login' /tmp/unauth-cms-headers.txt

          curl --fail --silent --show-error http://127.0.0.1:3100/backend-api/health -o /tmp/proxy-health.json
          grep -q '"status":"ok"' /tmp/proxy-health.json

          proxy_status="$(curl --silent --show-error --output /tmp/proxy-login.json --write-out '%{http_code}' \
            -X POST http://127.0.0.1:3100/backend-api/auth/login \
            -H 'Content-Type: application/json' \
            --data '{"email":"ci@example.test","password":"wrong-password"}')"
          if [ "$proxy_status" != "401" ]; then
            cat /tmp/proxy-login.json
            cat /tmp/next-start.log
            echo "Backend proxy did not preserve the upstream login response (HTTP $proxy_status)"
            exit 1
          fi
          grep -q 'Invalid email or password' /tmp/proxy-login.json

          # A successful login must set an HttpOnly cookie and never expose the Bearer token.
          login_status="$(curl --silent --show-error --output /tmp/bff-login.json --dump-header /tmp/bff-login-headers.txt --write-out '%{http_code}' \
            -X POST http://127.0.0.1:3100/backend-api/auth/login \
            -H 'Content-Type: application/json' \
            --data '{"email":"ci-admin@example.test","password":"valid-password"}')"
          if [ "$login_status" != "200" ]; then
            cat /tmp/bff-login.json
            cat /tmp/next-start.log
            echo "BFF login failed (HTTP $login_status)"
            exit 1
          fi
          grep -Eiq '^set-cookie: velzon_session=.*httponly' /tmp/bff-login-headers.txt
          if grep -q '"accessToken"' /tmp/bff-login.json; then
            echo "BFF leaked the access token in the login response"
            exit 1
          fi
          session_cookie="$(grep -i '^set-cookie: velzon_session=' /tmp/bff-login-headers.txt | head -n 1 | sed -E 's/^[^:]+:[[:space:]]*([^;]+).*/\1/I' | tr -d '\r')"
          test -n "$session_cookie"

          # A valid session cookie must allow the actual CMS dashboard to render.
          cms_status="$(curl --silent --show-error --output /tmp/cms-page.html --write-out '%{http_code}' \
            --cookie "$session_cookie" \
            http://127.0.0.1:3100/apps-cms)"
          if [ "$cms_status" != "200" ]; then
            cat /tmp/cms-page.html
            cat /tmp/next-start.log
            echo "Authenticated CMS dashboard did not render (HTTP $cms_status)"
            exit 1
          fi

          # Database-backed administration pages must also render inside the protected area.
          for cms_path in /apps-cms/users /apps-cms/permissions; do
            cms_module_status="$(curl --silent --show-error --output /tmp/cms-module.html --write-out '%{http_code}' \
              --cookie "$session_cookie" \
              "http://127.0.0.1:3100$cms_path")"
            if [ "$cms_module_status" != "200" ]; then
              cat /tmp/cms-module.html
              cat /tmp/next-start.log
              echo "Authenticated CMS module $cms_path did not render (HTTP $cms_module_status)"
              exit 1
            fi
          done

          # The BFF must use the HttpOnly cookie to add Authorization server-side.
          curl --fail --silent --show-error \
            --cookie "$session_cookie" \
            http://127.0.0.1:3100/backend-api/auth/me -o /tmp/bff-me.json
          grep -q '"email":"ci-admin@example.test"' /tmp/bff-me.json

          # Logout expires the server-managed session cookie.
          curl --silent --show-error --output /tmp/bff-logout.json --dump-header /tmp/bff-logout-headers.txt \
            -X POST http://127.0.0.1:3100/backend-api/auth/logout \
            --cookie "$session_cookie"
          grep -Eiq '^set-cookie: velzon_session=.*max-age=0' /tmp/bff-logout-headers.txt

          echo "CMS-only navigation redirects, protected dashboard/user/permission pages, same-origin proxy, HttpOnly login, authenticated API and logout smoke tests passed."
