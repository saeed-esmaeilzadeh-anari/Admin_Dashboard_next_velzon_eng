name: Frontend CMS CI
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/frontend-ci.yml"
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check
        env:
          NEXT_PUBLIC_DEFAULT_AUTH: fake
          NEXT_PUBLIC_BACKEND_API_URL: http://127.0.0.1:3001/api/v1
        run: npm run type-check
      - name: Production build
        env:
          NEXT_PUBLIC_DEFAULT_AUTH: fake
          NEXT_PUBLIC_BACKEND_API_URL: http://127.0.0.1:3001/api/v1
        run: npm run build
