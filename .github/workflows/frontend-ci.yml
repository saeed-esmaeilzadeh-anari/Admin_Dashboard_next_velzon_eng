name: Frontend CMS CI
# Revalidate the synchronized CMS branch, type-check and production build.
concurrency:
  group: cms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Keeps the CMS branch type-check and production build reproducible.
on:
  push:
    branches: [main, "feat/**", "chore/cms-post-merge-validation"]
    paths:
      - "src/**"
      - "public/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "middleware.ts"
      - "tsconfig.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "middleware.ts"
      - "tsconfig.json"
      - ".github/workflows/frontend-ci.yml"
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Install pinned Playwright browser test runner
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps @playwright/test@1.64.1
          npx playwright install --with-deps chromium
      - name: Type-check
        env:
          NEXT_PUBLIC_DEFAULT_AUTH: backend
          NEXT_PUBLIC_BACKEND_API_URL: http://127.0.0.1:3001/api/v1
        run: npm run type-check
      - name: Production build
        env:
          NEXT_PUBLIC_DEFAULT_AUTH: backend
          NEXT_PUBLIC_BACKEND_API_URL: http://127.0.0.1:3001/api/v1
        run: npm run build
      - name: Production server and backend proxy smoke test
        env:
          NEXT_PUBLIC_DEFAULT_AUTH: backend
          NEXT_PUBLIC_BACKEND_API_URL: http://127.0.0.1:3001/api/v1
          BACKEND_API_URL: http://127.0.0.1:3001/api/v1
          E2E_BASE_URL: http://localhost:3100
          PORT: 3100
        shell: bash
        run: |
          set -euo pipefail

          # A disposable local upstream verifies BFF auth/session proxying and public CMS Server Component rendering.
          node -e 'const http = require("node:http"); http.createServer((req, res) => { if (req.url === "/api/v1/health" && req.method === "GET") { res.writeHead(200, {"content-type":"application/json"}); res.end(JSON.stringify({status:"ok"})); return; } if (req.url === "/api/v1/auth/login" && req.method === "POST") { let body = ""; req.on("data", chunk => body += chunk); req.on("end", () => { const credentials = JSON.parse(body); if (credentials.email === "ci-admin@example.test" && credentials.password === "valid-password") { res.writeHead(200, {"content-type":"application/json"}); res.end(JSON.stringify({accessToken:"ci-bff-test-access-token-123456789", tokenType:"Bearer", expiresIn:900, user:{id:"ci-user-1",email:credentials.email,name:"CI Admin",role:"ADMIN"}})); } else { res.writeHead(401, {"content-type":"application/json"}); res.end(JSON.stringify({message:"Invalid email or password."})); } }); return; } if (req.url === "/api/v1/auth/register" && req.method === "POST") { let body = ""; req.on("data", chunk => body += chunk); req.on("end", () => { const input = JSON.parse(body); res.writeHead(201, {"content-type":"application/json"}); res.end(JSON.stringify({user:{id:"ci-register-1",email:String(input.email || "").toLowerCase(),name:String(input.name || ""),role:"USER",createdAt:"2026-11-05T00:00:00.000Z"}})); }); return; } if (req.url === "/api/v1/auth/me" && req.method === "GET") { if (req.headers.authorization === "Bearer ci-bff-test-access-token-123456789") { res.writeHead(200, {"content-type":"application/json"}); res.end(JSON.stringify({id:"ci-user-1",email:"ci-admin@example.test",name:"CI Admin",role:"ADMIN"})); } else { res.writeHead(401, {"content-type":"application/json"}); res.end(JSON.stringify({message:"Unauthorized"})); } return; } if (req.url === "/api/v1/auth/logout" && req.method === "POST") { if (req.headers.authorization === "Bearer ci-bff-test-access-token-123456789") { res.writeHead(200, {"content-type":"application/json"}); res.end(JSON.stringify({success:true})); } else { res.writeHead(401, {"content-type":"application/json"}); res.end(JSON.stringify({message:"Unauthorized"})); } return; } if (req.url === "/api/v1/public/cms/article/en-US/hello-world" && req.method === "GET") { res.writeHead(200, {"content-type":"application/json"}); res.end(JSON.stringify({id:"content-1",type:{key:"article",name:"Article"},locale:{code:"en-US",name:"English",direction:"LTR"},title:"CI Public Article",slug:"hello-world",excerpt:"Server rendered CMS smoke test",fields:{},terms:[],alternates:[]})); return; } if (req.url === "/api/v1/public/cms/menus/main/en-US" && req.method === "GET") { res.writeHead(200, {"content-type":"application/json"}); res.end(JSON.stringify({id:"menu-1",key:"main",name:"Main",locale:{id:"locale-en",code:"en-US",name:"English",nativeName:"English",direction:"LTR",isDefault:true,isActive:true},items:[]})); return; } res.writeHead(404, {"content-type":"application/json"}); res.end(JSON.stringify({message:"Not found"})); }).listen(3001, "127.0.0.1");' > /tmp/mock-api.log 2>&1 &
          api_pid=$!

          api_ready=0
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:3001/api/v1/health -o /dev/null; then
              api_ready=1
              break
            fi
            sleep 1
          done
          if [ "$api_ready" -ne 1 ]; then
            cat /tmp/mock-api.log
            echo "Mock backend did not start"
            exit 1
          fi

          npm run start > /tmp/next-start.log 2>&1 &
          server_pid=$!
          cleanup() {
            pkill -P "$server_pid" 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true
            kill "$api_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3100/apps-todo -o /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/next-start.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/next-start.log
            echo "Production server did not successfully render /apps-todo"
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3100/charts/apex-bar -o /dev/null

          # Published CMS pages render on the Next.js server and must use an absolute backend URL.
          curl --fail --silent --show-error http://127.0.0.1:3100/content/article/en-US/hello-world -o /tmp/cms-public.html
          grep -q 'CI Public Article' /tmp/cms-public.html

          curl --fail --silent --show-error http://127.0.0.1:3100/backend-api/health -o /tmp/proxy-health.json
          grep -q '"status":"ok"' /tmp/proxy-health.json

          proxy_status="$(curl --silent --show-error --output /tmp/proxy-login.json --write-out '%{http_code}' \
            -X POST http://127.0.0.1:3100/backend-api/auth/login \
            -H 'Content-Type: application/json' \
            --data '{"email":"ci@example.test","password":"wrong-password"}')"
          if [ "$proxy_status" != "401" ]; then
            cat /tmp/proxy-login.json
            cat /tmp/next-start.log
            echo "Backend proxy did not preserve the upstream login response (HTTP $proxy_status)"
            exit 1
          fi
          grep -q 'Invalid email or password' /tmp/proxy-login.json

          # A successful login must set an HttpOnly cookie and never expose the Bearer token.
          login_status="$(curl --silent --show-error --output /tmp/bff-login.json --dump-header /tmp/bff-login-headers.txt --write-out '%{http_code}' \
            -X POST http://127.0.0.1:3100/backend-api/auth/login \
            -H 'Content-Type: application/json' \
            --data '{"email":"ci-admin@example.test","password":"valid-password"}')"
          if [ "$login_status" != "200" ]; then
            cat /tmp/bff-login.json
            cat /tmp/next-start.log
            echo "BFF login failed (HTTP $login_status)"
            exit 1
          fi
          grep -Eiq '^set-cookie: velzon_session=.*httponly' /tmp/bff-login-headers.txt
          if grep -q '"accessToken"' /tmp/bff-login.json; then
            echo "BFF leaked the access token in the login response"
            exit 1
          fi

          # Registration returns a profile only and must not create a session cookie.
          registration_status="$(curl --silent --show-error --output /tmp/bff-register.json --dump-header /tmp/bff-register-headers.txt --write-out '%{http_code}' \
            -X POST http://127.0.0.1:3100/backend-api/auth/register \
            -H 'Content-Type: application/json' \
            --data '{"name":"CI New User","email":"ci-new-user@example.test","password":"valid-password-123"}')"
          if [ "$registration_status" != "201" ]; then
            cat /tmp/bff-register.json
            echo "BFF registration failed (HTTP $registration_status)"
            exit 1
          fi
          jq -e '.user.email == "ci-new-user@example.test" and (has("accessToken") | not)' /tmp/bff-register.json >/dev/null
          if grep -Eiq '^set-cookie: velzon_session=' /tmp/bff-register-headers.txt; then
            echo "Registration must not create an authenticated browser session"
            exit 1
          fi
          session_cookie="$(grep -i '^set-cookie: velzon_session=' /tmp/bff-login-headers.txt | head -n 1 | sed -E 's/^[^:]+:[[:space:]]*([^;]+).*/\1/I' | tr -d '\r')"
          test -n "$session_cookie"

          # The BFF must use the HttpOnly cookie to add Authorization server-side.
          curl --fail --silent --show-error \
            --cookie "$session_cookie" \
            http://127.0.0.1:3100/backend-api/auth/me -o /tmp/bff-me.json
          grep -q '"email":"ci-admin@example.test"' /tmp/bff-me.json

          # Logout expires the server-managed session cookie.
          curl --silent --show-error --output /tmp/bff-logout.json --dump-header /tmp/bff-logout-headers.txt \
            -X POST http://127.0.0.1:3100/backend-api/auth/logout \
            --cookie "$session_cookie"
          grep -Eiq '^set-cookie: velzon_session=.*max-age=0' /tmp/bff-logout-headers.txt
          grep -q '"sessionRevoked":true' /tmp/bff-logout.json

          echo "Production pages, server-rendered public CMS content, same-origin proxy, HttpOnly login, authenticated API and logout smoke tests passed."

          # Browser-driven journeys use the real Next.js production server and the disposable upstream.
          npx playwright test
