name: Frontend CMS CI
# Revalidate the synchronized CMS branch, type-check and production build.
concurrency:
  group: cms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Keeps the CMS branch type-check and production build reproducible.
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "middleware.ts"
      - "tsconfig.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "middleware.ts"
      - "tsconfig.json"
      - ".github/workflows/frontend-ci.yml"
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Type-check
        env:
          NEXT_PUBLIC_DEFAULT_AUTH: fake
          NEXT_PUBLIC_BACKEND_API_URL: http://127.0.0.1:3001/api/v1
        run: npm run type-check
      - name: Production build
        env:
          NEXT_PUBLIC_DEFAULT_AUTH: fake
          NEXT_PUBLIC_BACKEND_API_URL: http://127.0.0.1:3001/api/v1
        run: npm run build
      - name: Production server and backend proxy smoke test
        env:
          NEXT_PUBLIC_DEFAULT_AUTH: fake
          NEXT_PUBLIC_BACKEND_API_URL: http://127.0.0.1:3001/api/v1
          PORT: 3100
        shell: bash
        run: |
          set -euo pipefail

          # A tiny local upstream verifies that Next.js forwards method, path and body.
          node -e 'const http = require("node:http"); http.createServer((req, res) => { if (req.url === "/api/v1/health" && req.method === "GET") { res.writeHead(200, {"content-type":"application/json"}); res.end(JSON.stringify({status:"ok"})); return; } if (req.url === "/api/v1/auth/login" && req.method === "POST") { let body = ""; req.on("data", chunk => body += chunk); req.on("end", () => { res.writeHead(401, {"content-type":"application/json"}); res.end(JSON.stringify({message:"Invalid email or password.", received: JSON.parse(body)})); }); return; } res.writeHead(404, {"content-type":"application/json"}); res.end(JSON.stringify({message:"Not found"})); }).listen(3001, "127.0.0.1");' > /tmp/mock-api.log 2>&1 &
          api_pid=$!

          api_ready=0
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:3001/api/v1/health -o /dev/null; then
              api_ready=1
              break
            fi
            sleep 1
          done
          if [ "$api_ready" -ne 1 ]; then
            cat /tmp/mock-api.log
            echo "Mock backend did not start"
            exit 1
          fi

          npm run start > /tmp/next-start.log 2>&1 &
          server_pid=$!
          cleanup() {
            pkill -P "$server_pid" 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true
            kill "$api_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3100/apps-todo -o /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/next-start.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/next-start.log
            echo "Production server did not successfully render /apps-todo"
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3100/charts/apex-bar -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3100/backend-api/health -o /tmp/proxy-health.json
          grep -q '"status":"ok"' /tmp/proxy-health.json

          proxy_status="$(curl --silent --show-error --output /tmp/proxy-login.json --write-out '%{http_code}' \
            -X POST http://127.0.0.1:3100/backend-api/auth/login \
            -H 'Content-Type: application/json' \
            --data '{"email":"ci@example.test","password":"wrong-password"}')"
          if [ "$proxy_status" != "401" ]; then
            cat /tmp/proxy-login.json
            cat /tmp/next-start.log
            echo "Backend proxy did not preserve the upstream login response (HTTP $proxy_status)"
            exit 1
          fi
          grep -q 'Invalid email or password' /tmp/proxy-login.json

          echo "Production pages and same-origin backend API proxy smoke tests passed."
