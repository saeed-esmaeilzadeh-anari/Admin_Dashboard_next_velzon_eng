name: Format Shared CMS Frontend Files

on:
  push:
    branches: [chore/cms-post-merge-validation]
    paths:
      - ".github/workflows/format-shared-cms-files.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Format the exact shared files reported by full lint
        run: >-
          npx prettier --write
          "src/components/Cms/PublicCmsHeader.tsx"
          "src/components/Cms/RelationField.tsx"
          "src/components/Cms/RepeaterField.tsx"
          "src/components/Common/ProfileDropdown.tsx"
          "src/helpers/backendApi.ts"
          "src/helpers/cmsApi.ts"
      - name: Commit formatting changes with fast-forward safety
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            "src/components/Cms/PublicCmsHeader.tsx" \
            "src/components/Cms/RelationField.tsx" \
            "src/components/Cms/RepeaterField.tsx" \
            "src/components/Common/ProfileDropdown.tsx" \
            "src/helpers/backendApi.ts" \
            "src/helpers/cmsApi.ts"
          if git diff --cached --quiet; then
            echo "The selected shared frontend files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(frontend): format shared CMS components and API helpers"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
