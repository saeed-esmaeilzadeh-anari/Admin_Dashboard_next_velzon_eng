name: Regenerate patched Next dependency lock
on:
  push:
    branches: ["feat/full-stack-foundation"]
    paths:
      - ".github/workflows/regenerate-next-lock.yml"
permissions:
  contents: write
concurrency:
  group: regenerate-next-lock
  cancel-in-progress: false
jobs:
  regenerate-and-remove-helper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install patched Next.js and React versions and regenerate lockfile
        run: |
          npm install next@15.5.28 react@19.2.7 react-dom@19.2.7 --save-exact --legacy-peer-deps --no-audit --no-fund
          npm install --save-dev eslint-config-next@15.5.28 --save-exact --legacy-peer-deps --no-audit --no-fund
      - name: Commit regenerated dependency lock and remove this temporary helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/regenerate-next-lock.yml
          git add package.json package-lock.json .github/workflows/regenerate-next-lock.yml
          git commit -m "fix(security): update Next.js and React to patched releases"
          git push origin HEAD:feat/full-stack-foundation
