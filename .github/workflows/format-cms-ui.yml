name: Format CMS UI

on:
  push:
    branches: [chore/cms-post-merge-validation]
    paths:
      - ".github/workflows/format-cms-ui.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Format all CMS route and component TSX files
        run: npx prettier --write "src/app/(with-layout)/apps-cms/**/*.tsx"
      - name: Commit formatting changes with fast-forward safety
        shell: bash
        run: |
          set -euo pipefail
          git add -- "src/app/(with-layout)/apps-cms/"
          if git diff --cached --quiet; then
            echo "All CMS TSX sources already use the repository formatter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(cms): format all CMS route and component TSX files"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
